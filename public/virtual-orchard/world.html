<!doctype html>
<html lang="ja" class="orchardFontsPending">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#dce9db" />
  <title>みつばち果樹園</title>
  <link rel="preload" href="/fonts/GenSenRoundedJP-H.otf" as="font" type="font/otf" crossorigin="anonymous" />
  <link rel="stylesheet" href="/virtual-orchard/world.css?v=20261116-discovery-v1" />
</head>
<body>
  <main id="world">
    <div id="canvasMount"></div>
    
    <div class="altitudeControls" aria-label="飛行の高度を変える">
      <button type="button" id="riseButton" aria-label="上昇する">↑<small>上昇</small></button>
      <button type="button" id="fallButton" aria-label="下降する">↓<small>下降</small></button>
    </div>
    <div id="flightToast" class="flightToast" role="status" aria-live="polite"></div>
    <div id="pointerHint" class="pointerHint" aria-live="polite"></div>
    <div id="joystick" class="joystick" aria-label="移動スティック"><div class="joystickPad"></div><div id="knob" class="knob"></div></div>
    <div id="loadMessage" class="loadMessage">みつばちの飛行を準備中…</div>
  </main>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.__orchardReady) {
          document.getElementById('loadMessage').textContent = '通信環境を確認して、ページを再読み込みしてください。';
          window.parent.postMessage({type:'orchard:error'},window.location.origin);
        }
      }, 16000);
    });
  </script>
  <script type="module" src="/virtual-orchard/world.js?v=20261116-discovery-v1"></script>
</body>
</html>
